name: Terraform Prod

concurrency:
  group: terraform-prod
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
    paths:
      - "env/prod/**"
      - "k8s-infrastructure/**"
      - ".github/workflows/terraform-plan-prod.yml"
  push:
    branches: [main]
    paths:
      - "env/prod/**"
      - "k8s-infrastructure/**"
      - ".github/workflows/terraform-plan-prod.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: "us-east-1"
  TF_VERSION: "1.14.8"
  PLAN_BUCKET: "wri-odp-tfm-state-bucket"

jobs:
  terraform-plan:
    name: "Terraform Plan Prod"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: env/prod
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Validate
        working-directory: env/prod
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: env/prod
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Upload plan to S3
        if: success()
        run: |
          aws s3 cp env/prod/tfplan \
            "s3://${{ env.PLAN_BUCKET }}/wri-odp-infrastructure/prod/pr-${{ github.event.pull_request.number }}/tfplan"

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOk = '${{ steps.plan.outcome }}' === 'success';
            const icon = planOk ? '✅' : '❌';

            let plan = fs.readFileSync(
              `${process.env.GITHUB_WORKSPACE}/env/prod/plan_output.txt`,
              'utf8'
            );

            const MAX_LEN = 60000;
            if (plan.length > MAX_LEN) {
              plan = plan.substring(0, MAX_LEN) + '\n\n... (truncated)';
            }

            const body = [
              `#### ${icon} Terraform Plan — \`prod\``,
              '',
              '<details>',
              `<summary>Show plan output</summary>`,
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by @${context.actor} in #${context.issue.number}*`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome != 'success'
        run: exit 1

  terraform-apply:
    name: "Terraform Apply Prod"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: env/prod
        run: terraform init -input=false -lockfile=readonly

      - name: Download plan from S3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Could not find PR for commit ${{ github.sha }}"
            exit 1
          fi
          echo "Found PR #${PR_NUMBER}"

          aws s3 cp \
            "s3://${{ env.PLAN_BUCKET }}/wri-odp-infrastructure/prod/pr-${PR_NUMBER}/tfplan" \
            env/prod/tfplan

      - name: Terraform Apply
        working-directory: env/prod
        run: terraform apply -input=false tfplan
