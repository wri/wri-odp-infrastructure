name: Terraform Prod

concurrency:
  group: terraform-prod
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
    paths:
      - "env/prod/**"
      - "k8s-infrastructure/**"
      - ".github/workflows/terraform-plan-prod.yml"
  push:
    branches: [main]
    paths:
      - "env/prod/**"
      - "k8s-infrastructure/**"
      - ".github/workflows/terraform-plan-prod.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: read

env:
  AWS_REGION: "us-east-1"
  TF_VERSION: "1.14.8"

jobs:
  terraform-plan:
    name: "Terraform Plan Prod"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: env/prod
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: env/prod
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: env/prod
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload plan artifact
        if: steps.plan.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: env/prod/tfplan
          retention-days: 7

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            const icon = exitCode === '0' ? '✅' : '❌';

            let plan = fs.readFileSync(
              `${process.env.GITHUB_WORKSPACE}/env/prod/plan_output.txt`,
              'utf8'
            );

            const MAX_LEN = 60000;
            if (plan.length > MAX_LEN) {
              plan = plan.substring(0, MAX_LEN) + '\n\n... (truncated)';
            }

            const body = [
              `#### ${icon} Terraform Plan — \`prod\``,
              '',
              '<details>',
              `<summary>Show plan output</summary>`,
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
              '',
              `*Triggered by @${context.actor} in #${context.issue.number}*`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exit_code != '0'
        run: exit 1

  terraform-apply:
    name: "Terraform Apply Prod"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: env/prod
        run: terraform init -input=false

      - name: Download plan from PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Could not find PR for commit ${{ github.sha }}"
            exit 1
          fi
          echo "Found PR #${PR_NUMBER}"

          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/terraform-plan-prod.yml/runs?event=pull_request&status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.pull_requests[].number == ${PR_NUMBER})] | .[0].id")

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful plan run found for PR #${PR_NUMBER}"
            exit 1
          fi
          echo "Downloading plan from run ${RUN_ID}"

          gh run download "$RUN_ID" --name tfplan-prod --dir env/prod

      - name: Terraform Apply
        working-directory: env/prod
        run: terraform apply -input=false tfplan
